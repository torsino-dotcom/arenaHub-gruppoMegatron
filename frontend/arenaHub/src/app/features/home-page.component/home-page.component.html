<app-home-hero
    eyebrow="La tua arena esports"
    title="ArenaHub"
    subtitle="Scopri i tornei e trova la tua prossima sfida"
    ctaLabel="Scopri i giochi"
    (ctaClick)="scrollToGames()"
/>

<app-game-grid
    id="games"
    [games]="games()"
    (gameSelected)="selectGame($event)"
/>

@if (selectedGame(); as game) {
    <p class="home-page__selection" aria-live="polite">
        Gioco selezionato: <strong>{{ game.name }}</strong>
    </p>
}

<app-home-tournaments-preview />
