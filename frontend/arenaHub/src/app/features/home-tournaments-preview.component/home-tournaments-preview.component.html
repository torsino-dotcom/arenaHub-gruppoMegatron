<section class="tournaments-preview">
    <div class="container-xl">
        <div class="tournaments-preview__heading">
            <div>
                <p class="tournaments-preview__eyebrow">Scendi in campo</p>
                <h2 class="tournaments-preview__title">Tornei in evidenza</h2>
                <p class="tournaments-preview__description">
                    Trova la prossima sfida e mettiti alla prova.
                </p>
            </div>
            <a class="tournaments-preview__all-link" routerLink="/tornei">
                Tutti i tornei
                <span aria-hidden="true">→</span>
            </a>
        </div>

        <div class="row g-4">
            @for (tournament of tournaments(); track tournament.id_tornei) {
                <div class="col-12 col-md-6 col-xl-4">
                    <app-tournament-card [tournament]="tournament"/>
                </div>
            }
        </div>

        <div class="tournaments-preview__mobile-link">
            <a class="ah-button-primary" routerLink="/tornei">
                Scopri tutti i tornei
            </a>
        </div>
    </div>
</section>
