<section class="ah-section d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        
        <div class="ah-surface p-4 p-md-5">
          <p class="ah-eyebrow">Benvenuto</p>
          <h2 class="ah-section-title mb-4">Accedi</h2>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2 mb-3" role="alert" style="font-size: 0.85rem;">
              {{ errorMessage() }}
            </div>
          }

          <form (submit)="onSubmit($event)">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              
              <input 
                type="email" 
                class="form-control" 
                id="email" 
                placeholder="tua@email.com"
                [ngModel]="email()" 
                (ngModelChange)="email.set($event)"
                name="email"
                required>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                placeholder="••••••••"
                [ngModel]="password()" 
                (ngModelChange)="password.set($event)"
                name="password"
                required>
            </div>

            <button 
              type="submit" 
              class="ah-button-primary w-100" 
              [disabled]="!isFormValid() || isLoading()">
              @if (isLoading()) {
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Accesso in corso...
              } @else {
                Accedi
              }
            </button>
          </form>

          <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.9rem;">
            Se non hai un account: <a routerLink="/registrati">Registrati</a>
          </p>
        </div>

      </div>
    </div>
  </div>
</section>
