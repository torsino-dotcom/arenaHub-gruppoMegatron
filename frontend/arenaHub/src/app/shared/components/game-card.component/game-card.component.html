<button class="game-card" type="button" [attr.aria-label]="'Mostra i tornei di ' + game().name">

    @if (game().imageUrl) {
    <img class="game-card__image" [src]="game().imageUrl" [alt]="''" loading="lazy" />
    } @else {
    <span class="game-card__placeholder" aria-hidden="true">
        {{ game().name.charAt(0) }}
    </span>
    }
    <span class="game-card__overlay"></span>
    <span class="game-card__name">{{ game().name }}</span>
    <span class="game-card__arrow" aria-hidden="true">↗</span>
</button>
